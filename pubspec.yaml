name: file_organizer
description: A high-speed file organizer for rapid file management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  file_picker: ^6.1.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  path: ^1.8.3
  intl: ^0.18.1
  device_info_plus: ^9.1.2

flutter:
  uses-material-design: true
