name: file_organizer
description: A high-speed file organizer for rapid file management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.1
  path_provider: ^2.1.6
  file_picker: ^10.3.0
  shared_preferences: ^2.5.6
  path: ^1.8.3
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
